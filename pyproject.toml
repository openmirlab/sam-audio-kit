[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam-audio-kit"
version = "0.2.0"
description = "Creative audio toolkit for Meta's SAM-Audio model with synthesis, effects, and VRAM-efficient inference"
readme = "README.md"
# SPDX license expression (PEP 639). This is a truthful, mixed-license
# expression, NOT a single OSI license:
#   - LicenseRef-Meta-SAM-License: Meta's custom SAM License covers the
#     vendored/derived SAM-Audio model code (src/sam_audio_kit/sam_audio/**).
#     It is source-available but NOT OSI-approved and imposes redistribution
#     and use-restriction terms of its own (see LICENSE.SAM-AUDIO).
#   - Apache-2.0: covers the Perception Encoders component only (see LICENSE.PE).
#   - MIT: covers the original OpenMIRLab wrapper code (see LICENSE).
# See LICENSING.md for the full per-component mapping. Do not collapse this
# back to a plain OSI identifier -- that would misrepresent the SAM terms.
license = "LicenseRef-Meta-SAM-License AND MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE.SAM-AUDIO", "LICENSE.PE"]
requires-python = ">=3.10"
authors = [
    {name = "OpenMIRLab"}
]
keywords = [
    "audio",
    "separation",
    "synthesis",
    "sam-audio",
    "deep-learning",
    "pytorch",
    "creative-audio",
    "latent-space",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # Not "License :: OSI Approved :: MIT License": most of this package's
    # functionality (the SAM-Audio model code) is under Meta's non-OSI SAM
    # License, not MIT. Only the wrapper is MIT. See LICENSING.md.
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core PyTorch
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",

    # Model loading
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",

    # Transformers & Text
    "transformers>=4.48.0",

    # Audio processing
    "torchcodec>=0.1.0",
    # NOTE: dacvae (the neural audio codec used by the core SAM-Audio model,
    # see src/sam_audio_kit/sam_audio/model/codec.py) is intentionally NOT
    # listed here. It has no PyPI release, and PyPI's upload validation
    # rejects any package whose metadata contains a direct URL/VCS dependency
    # (git+https://...) -- even under an optional-dependencies extra. Declaring
    # it here would make sam-audio-kit permanently unpublishable to PyPI.
    # Install it manually -- see README.md "Installing the audio codec (dacvae)".

    # ODE solver for diffusion
    "torchdiffeq>=0.2.0",

    # Vision encoder dependencies
    "timm>=0.9.0",
    "einops>=0.7.0",
    "xformers>=0.0.20",

    # CLAP text ranker
    "laion-clap>=1.1.0",
    # Transitive floor bumps (laion-clap -> librosa -> numba/llvmlite): older
    # resolver-picked versions (librosa<0.10, numba<0.61, llvmlite<0.44) build
    # from source on Python 3.12+ and fail there (numba's setup.py imports the
    # removed `numpy.distutils`; llvmlite<0.44 hard-refuses Python>=3.10).
    # sam-audio-kit doesn't call these directly -- the floors exist only to
    # steer the resolver away from those broken versions. Confirmed via a
    # clean-venv `pip install` per Python version in 3.10-3.13.
    "librosa>=0.10.0",
    "numba>=0.61.0",
    "llvmlite>=0.44.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/openmirlab/sam-audio-kit"
Documentation = "https://github.com/openmirlab/sam-audio-kit#readme"
Repository = "https://github.com/openmirlab/sam-audio-kit.git"
Issues = "https://github.com/openmirlab/sam-audio-kit/issues"

[project.scripts]
sam-audio-kit = "sam_audio_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sam_audio_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=sam_audio_kit"
