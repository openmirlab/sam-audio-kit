# "checkpoint.pt" -- confirmed by reading that loader -- so this is the
# artifact judge.py actually consumes at load time, not model.safetensors.
#
# KNOWN DISCREPANCY (ratification item, not fixed here): SAMAudioJudgeModel
# hardcodes revision="sam_audio" (a named ref on this repo, not a commit),
# which resolves today to a DIFFERENT commit (cd52eb977697cc0b25d4ecd309a88d
# 4af46223ee) whose checkpoint.pt has a different sha256
# (654d1ae6dd73c1c6a8e15dc5ed942f84c06082af4569d28abbe9f33f8c26b58d, 6135460140
# bytes) -- confirmed live via model_info(revision="sam_audio"). This pinned
# d461b0b9... commit's checkpoint.pt digest below is itself confirmed correct
# for that specific commit (also verified live), but download_model(include_
# judge=True) pre-caching against it would NOT pre-cache what
# SAMAudioJudgeModel.from_pretrained() actually loads if ever exercised --
# no shipped code path currently instantiates it (ranking/__init__.py's
# create_ranker returns None for JudgeRankerConfig), so this is inert today.
