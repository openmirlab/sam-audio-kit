# Package-owned checkpoint registry.  URLs point to the official gated
# Hugging Face repositories; this package never bundles or mirrors weights.
#
# sha256 / size_bytes below are each artifact's git-LFS-recorded OID, read
# from the Hub via `HfApi().model_info(repo, files_metadata=True)` (the
# authoritative Hub record) on 2026-09-14. This is metadata-only: gated
# raw-content resolve (`get_hf_file_metadata`) 403s for the checking account,
# so no independent byte-level re-hash of a downloaded file has confirmed
# these against actual bytes yet -- see checkpoint-catalog contract sec. 4.
# `source_revision` pins the exact commit each digest was read from; never
# let it float back to "main".

