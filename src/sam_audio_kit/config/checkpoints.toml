# Package-owned checkpoint registry.  URLs point to the official gated
# Hugging Face repositories; this package never bundles or mirrors weights.
#
# sha256 / size_bytes below are each artifact's git-LFS-recorded OID, read
# from the Hub via `HfApi().model_info(repo, files_metadata=True)` (the
# authoritative Hub record) on 2026-09-14. `source_revision` pins the exact
# commit each digest was read from; never let it float back to "main".
#
# Byte-level status per entry (2026-09-14): small/base/large were also
# independently re-hashed with `sha256sum` against real downloaded files
# already present in this machine's local HF cache -- found, by coincidence,
# to already sit at exactly these pinned commits (Paul's own prior
# downloads) -- and matched bit-exact on both sha256 and byte size. `judge`
# remains metadata-only: gated raw-content resolve (`get_hf_file_metadata`)
# 403s for the checking account (yytung, not Paul's own), and no locally
# cached file exists at judge's pinned commit to re-hash against -- see
# checkpoint-catalog contract sec. 4 and CHANGELOG for the fuller note.

