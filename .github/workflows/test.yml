# test.yml -- CI gate that runs on every push/PR, independent of releases.
# Before this file, the only CI was publish.yml, which builds/tests on a
# single pinned Python (3.11) and only at release time -- so a PR could land
# on main with a broken install or a broken test on any other classified
# Python version, and nobody would know until a release. This workflow closes
# that gap: a Python matrix over everything pyproject.toml's classifiers claim
# (3.10-3.12) plus 3.13 (verified passing locally, not yet advertised in
# classifiers) so the claim and the tested reality stay in sync, and a
# wheel-from-sdist build/install smoke test per the org's packaging article
# (openmirlab-skills/plugins/openmirlab/CLAUDE.md, art. 7).
#
# dacvae has no PyPI release, so it cannot appear in published metadata.
# CI installs a fixed upstream commit explicitly to test the real import and
# regression suite; see README.md "Installing the audio codec (dacvae)".

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install 'dacvae @ git+https://github.com/facebookresearch/dacvae@414c20785fc3a28373073ea8ef7a1316eeeaca6e'

      - name: Run tests
        run: pytest tests/ --cov=sam_audio_kit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel from sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-check-venv
          /tmp/wheel-check-venv/bin/pip install --upgrade pip
          /tmp/wheel-check-venv/bin/pip install dist/*.whl
          /tmp/wheel-check-venv/bin/pip install 'dacvae @ git+https://github.com/facebookresearch/dacvae@414c20785fc3a28373073ea8ef7a1316eeeaca6e'

      - name: Import smoke test (touch a public symbol)
        run: |
          /tmp/wheel-check-venv/bin/python - <<'PY'
          import sam_audio_kit
          assert hasattr(sam_audio_kit, "SamAudio")
          print(f"OK: imported sam_audio_kit {sam_audio_kit.__version__}, touched SamAudio")
          PY
