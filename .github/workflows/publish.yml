# publish.yml -- Build/test gate for PyPI releases. RELEASE IS CURRENTLY
# LICENSE-GATED: this repo's pyproject.toml license metadata was recently
# corrected to reflect that most of the code (SAM-Audio model) ships under
# Meta's custom, non-OSI "SAM License" (see LICENSE.SAM-AUDIO), not a plain
# OSI license. Whether/how this project may be redistributed via PyPI at all
# under those terms has NOT yet been reviewed and decided by a human. Until
# that review happens, the "Publish to PyPI" step below is deliberately
# commented out -- an accidental GitHub Release must not be able to push a
# possibly-mislabeled or non-redistributable package to PyPI. The `test` and
# `build` jobs still run on every release/dispatch so build health is
# continuously verified; only the final publish action is disabled. See
# CLAUDE.md and LICENSING.md for the full license situation and what needs to
# happen before this can be re-enabled.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --cov=sam_audio_kit

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # PyPI publish is intentionally disabled -- license-gated pending human
      # review (see the top-of-file comment and CLAUDE.md). Re-enable only
      # after that review confirms this project may be distributed via PyPI
      # under the corrected LicenseRef-Meta-SAM-License AND MIT AND Apache-2.0
      # metadata.
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
